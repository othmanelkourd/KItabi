[versions]
agp = "8.13.2"
android-compileSdk = "36"
android-minSdk = "24"
android-targetSdk = "36"
androidx-activity = "1.12.2"
androidx-appcompat = "1.7.1"
androidx-core = "1.17.0"
androidx-espresso = "3.7.0"
androidx-lifecycle = "2.9.6"
androidx-testExt = "1.3.0"
composeMultiplatform = "1.10.0"
junit = "4.13.2"
kotlin = "2.3.0"
kotlinx-datetime = "0.7.1"
kotlinx-serialization-version = "1.6.3"
kotlinx-coroutines-version = "1.8.1"
kamel-version = "0.9.5"
ktor-version = "2.3.12"
koin-core-version = "3.5.6"
koin-compose-version = "1.1.5"
koin-android-version = "3.5.6"
compose-tooling-version = "1.10.1"
camerax-version = "1.3.0"
mlkit-barcode-version = "17.1.0"
androidx-permissions-version = "1.13.0"
room-version = "2.8.4"
ksp-version = "2.3.4"
guava-version = "33.0.0-android"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-testExt-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-testExt" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "androidx-appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodelCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }
# Serialization and API integration
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization-version" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines-version" }
ktor-client-json = { module = "io.ktor:ktor-client-serialization", version.ref = "ktor-version" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor-version" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor-version" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor-version" }
kamel = { module = "media.kamel:kamel-image", version.ref = "kamel-version" }
kator = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor-version" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin-core-version" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin-compose-version" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin-android-version" }
compose-tooling = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "compose-tooling-version" }
# Camera and Barcode Scanning
camerax-core = { module = "androidx.camera:camera-core", version.ref = "camerax-version" }
camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax-version" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax-version" }
camerax-view = { module = "androidx.camera:camera-view", version.ref = "camerax-version" }
mlkit-barcode = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkit-barcode-version" }
androidx-permissions = { module = "androidx.compose.permissions:permissions", version.ref = "androidx-permissions-version" }
# Room Database
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room-version" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room-version" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room-version" }
guava = { module = "com.google.guava:guava", version.ref = "guava-version" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp-version" }
